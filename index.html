    <style>
        :root {
            --bg-color: #06120a;
            --surface-color: rgba(12, 28, 18, 0.75);
            --card-bg: rgba(18, 38, 25, 0.6);
            --border-color: rgba(74, 120, 86, 0.25);
            --border-hover: rgba(74, 222, 128, 0.4);
            --emerald-primary: #10b981;
            --emerald-bright: #4ade80;
            --emerald-glow: rgba(74, 222, 128, 0.15);
            --gold-accent: #fbbf24;
            --text-main: #f0fdf4;
            --text-muted: #a7f3d0;
            --text-sub: #6ee7b7;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            line-height: 1.6;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(5, 150, 105, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            padding-bottom: 60px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* HEADER & NAVIGATION */
        header {
            padding: 24px 0;
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(6, 18, 10, 0.85);
        }

        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--emerald-primary), #047857);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.2rem;
            box-shadow: 0 0 20px var(--emerald-glow);
        }

        .brand-name {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .brand-name span {
            color: var(--emerald-bright);
        }

        .brand-tagline-sm {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            display: block;
            margin-top: -4px;
        }

        /* HERO SECTION */
        .hero {
            position: relative;
            padding: 80px 0 60px 0;
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin: 30px 0 50px 0;
            background: linear-gradient(180deg, rgba(6, 18, 10, 0.3) 0%, rgba(6, 18, 10, 0.95) 100%),
                        url('https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?auto=format&fit=crop&w=1800&q=80') center/cover no-repeat;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--emerald-bright);
            color: var(--emerald-bright);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 20px;
            backdrop-filter: blur(8px);
        }

        .hero-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.4rem, 5vw, 3.8rem);
            font-weight: 700;
            line-height: 1.15;
            color: #ffffff;
            margin-bottom: 16px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }

        .hero-title span {
            background: linear-gradient(135deg, var(--emerald-bright), #a7f3d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-description {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 32px;
            font-weight: 300;
        }

        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-item {
            text-align: center;
        }

        .stat-num {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--emerald-bright);
            display: block;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* NAVIGATION TABS */
        .tabs-wrapper {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .tab-button {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 14px 24px;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }

        .tab-button:hover {
            border-color: var(--border-hover);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .tab-button.active {
            background: linear-gradient(135deg, var(--emerald-primary), #047857);
            border-color: var(--emerald-bright);
            color: #ffffff;
            box-shadow: 0 8px 20px var(--emerald-glow);
        }

        /* TAB PANELS */
        .tab-panel {
            display: none;
